<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netanya – rue Gad Manela · modèle 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9db8d6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; width: 270px; background: rgba(255,255,255,0.9); backdrop-filter: blur(6px);
           border-radius: 10px; padding: 12px 14px; font-size: 13px; color: #1d2733; box-shadow: 0 4px 18px rgba(0,0,0,0.18); }
  #panel h1 { font-size: 15px; margin: 0 0 2px; }
  #panel .sub { color: #5a6775; font-size: 11.5px; margin-bottom: 8px; }
  #views { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
  #views button { flex: 1 1 45%; border: 1px solid #c5ced8; background: #f5f7fa; border-radius: 6px; padding: 5px 4px; font-size: 12px; cursor: pointer; }
  #views button:hover { background: #e3ebf5; }
  label { display: block; margin: 5px 0; }
  input[type=range] { width: 100%; }
  #stats { margin-top: 8px; padding-top: 8px; border-top: 1px solid #dde3ea; line-height: 1.5; font-size: 12px; }
  #help { position: fixed; bottom: 10px; left: 12px; font-size: 11.5px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
  #toggle { display: none; }
  #compassWrap { position: fixed; top: 14px; right: 14px; width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.88); box-shadow: 0 3px 12px rgba(0,0,0,0.2); }
  #compass { width: 100%; height: 100%; position: relative; }
  #compass::before { content: ''; position: absolute; left: 50%; top: 8px; margin-left: -7px; border: 7px solid transparent; border-bottom: 22px solid #c62828; border-top: 0; }
  #compass::after { content: ''; position: absolute; left: 50%; bottom: 8px; margin-left: -7px; border: 7px solid transparent; border-top: 22px solid #455a64; border-bottom: 0; }
  #compass span { position: absolute; left: 0; right: 0; top: -1px; text-align: center; font: bold 11px sans-serif; color: #c62828; }
  #attr { position: fixed; bottom: 6px; right: 10px; font-size: 10.5px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); max-width: 60%; text-align: right; }
  @media (max-width: 640px) { #panel { width: calc(100% - 52px); font-size: 12px; } }
</style>
</head>
<body>
<div id="panel">
  <h1>Immeuble bureaux &amp; commerces</h1>
  <div class="sub">Rue Gad Manela, Netanya (Poleg) · d'après le plan de RDC 1:125, l'imagerie satellite (Esri, Sentinel‑2) et les photos</div>
  <div id="views"></div>
  <label>Heure (fin novembre) : <b id="hourv">14h30</b><input id="hour" type="range" min="6.75" max="17" step="0.25" value="14.5"></label>
  <label>Étages affichés : <b id="cutv">tous</b><input id="cut" type="range" min="0" max="8" step="1" value="8"></label>
  <label><input id="grid" type="checkbox"> Axes de la trame (1–18 / A–J)</label>
  <label><input id="ctx" type="checkbox" checked> Contexte (voisins, grue)</label>
  <div id="stats"></div>
</div>
<div id="compassWrap"><div id="compass"><span>N</span></div></div>
<div id="attr"></div>
<div id="help">Clic gauche : tourner · clic droit : déplacer · molette : zoom</div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
